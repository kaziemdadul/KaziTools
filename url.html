<body>

        <nav class="sidebar-nav">

        </nav>
    </div>
    <div class="overlay" id="sidebar-overlay"></div>

    <div class="page-wrapper">
        <div class="container">
            <h2>URL Encode & Decode</h2>
            <label>INPUT URL OR TEXT</label>
            <textarea id="urlInput" placeholder="https://example.com/search?q=hello world"
                style="min-height: 120px;"></textarea>

            <div class="grid-input" style="grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <button class="gen-btn" onclick="encodeUrl()" style="margin-bottom: 0;">[ ENCODE URL ]</button>
                <button class="gen-btn" onclick="decodeUrl()"
                    style="background: linear-gradient(135deg, #374151, #1e293b); box-shadow: none; margin-bottom: 0;">[
                    DECODE URL ]</button>
            </div>

            <label>RESULT</label>
            <div class="output-container" style="height: 150px; padding: 0;">
                <textarea id="urlOutput" readonly
                    style="width: 100%; height: 100%; border: none; background: transparent; color: #a7f3d0; margin: 0; padding: 15px; resize: none;"></textarea>
            </div>
            <button class="copy-btn" onclick="copyUrl()">COPY DATA</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function encodeUrl() {
            const input = document.getElementById('urlInput').value;
            if (!input) { showAlert('PLEASE ENTER TEXT TO ENCODE', true); return; }
            document.getElementById('urlOutput').value = encodeURIComponent(input);
            showAlert('SUCCESSFULLY ENCODED');
        }
        function decodeUrl() {
            const input = document.getElementById('urlInput').value;
            if (!input) { showAlert('PLEASE ENTER URL TO DECODE', true); return; }
            try {
                document.getElementById('urlOutput').value = decodeURIComponent(input);
                showAlert('SUCCESSFULLY DECODED');
            } catch (e) {
                showAlert('INVALID URL ENCODING', true);
            }
        }
        function copyUrl() {
            const out = document.getElementById('urlOutput').value;
            if (!out) { showAlert('NO OUTPUT TO COPY', true); return; }
            if (navigator.clipboard) {
                navigator.clipboard.writeText(out).then(() => { showAlert('COPIED!'); }).catch(() => fallbackCopy(out));
            } else { fallbackCopy(out); }
        }
        function fallbackCopy(text) {
            let temp = document.createElement("textarea"); temp.value = text;
            document.body.appendChild(temp); temp.select(); document.execCommand("copy");
            document.body.removeChild(temp); showAlert("COPIED!");
        }
    </script>
</body>

</html>
