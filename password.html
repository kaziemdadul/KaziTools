<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator Pro</title>
    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Custom Alert Box -->
    <div id="customAlert" class="toast-overlay">
        <h3 id="alertTitle">&gt;&gt; SYSTEM ALERT &lt;&lt;</h3>
        <p id="alertMsg">Operation Completed.</p>
    </div>

    <!-- Navigation Header -->
    <nav class="top-nav">
        <a href="/" class="nav-brand" style="text-decoration: none;">KAZI TOOLS PRO</a>

        <!-- Hamburger Menu -->
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nav-links" id="navLinks">
            <a href="/" class="nav-item">Home</a>
            <a href="cardgen.html" class="nav-item">Card Gen</a>
            <a href="password.html" class="nav-item active">Password Gen</a>
            <a href="prefix.html" class="nav-item">Suffix & Prefix</a>
            <a href="bin.html" class="nav-item">BIN Checker</a>
            <a href="tempmail.html" class="nav-item">Temp Mail</a>
        </div>
    </nav>

    <div class="page-wrapper">
        <div class="container">
            <h2>Password Generator</h2>

            <div class="grid-input">
                <div>
                    <label>LENGTH</label>
                    <input type="number" id="passLength" value="5" min="4" max="128">
                </div>
                <div>
                    <label>QUANTITY</label>
                    <input type="number" id="passQty" value="10" min="1" max="100">
                </div>
            </div>

            <!-- Checkboxes for options -->
            <label style="margin-top: 10px; font-size: 16px; color: var(--text);">OPTIONS</label>
            <div
                style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 25px; padding: 15px; background: #111827; border: 1px solid var(--border); border-radius: 4px;">
                <label
                    style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; color: #d1d5db;">
                    <input type="checkbox" id="incUpper" style="width: auto; margin: 0;"> Uppercase (A-Z)
                </label>
                <label
                    style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; color: #d1d5db;">
                    <input type="checkbox" id="incLower" style="width: auto; margin: 0;"> Lowercase (a-z)
                </label>
                <label
                    style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; color: #d1d5db;">
                    <input type="checkbox" id="incNumbers" checked style="width: auto; margin: 0;"> Numbers (0-9)
                </label>
                <label
                    style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; color: #d1d5db;">
                    <input type="checkbox" id="incSymbols" style="width: auto; margin: 0;"> Symbols (!@#$...)
                </label>
            </div>

            <button class="gen-btn" onclick="generatePasswords()">[ INITIATE GENERATION ]</button>

            <div id="outputContainer" class="output-container">
                <div class="output-placeholder" id="placeholderMsg">// RESULTS WAITING...</div>
            </div>
            <textarea id="outputHidden" style="display:none;"></textarea>

            <button class="copy-btn" onclick="copyAll()">COPY ALL DATA</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('show');
        }

        function generatePasswords() {
            const length = parseInt(document.getElementById('passLength').value);
            const qty = parseInt(document.getElementById('passQty').value);
            const incUpper = document.getElementById('incUpper').checked;
            const incLower = document.getElementById('incLower').checked;
            const incNumbers = document.getElementById('incNumbers').checked;
            const incSymbols = document.getElementById('incSymbols').checked;

            const outputContainer = document.getElementById('outputContainer');
            const outputHidden = document.getElementById('outputHidden');

            if (length < 4) {
                showAlert("LENGTH MUST BE AT LEAST 4", true);
                return;
            }

            if (!incUpper && !incLower && !incNumbers && !incSymbols) {
                showAlert("SELECT AT LEAST ONE OPTION", true);
                return;
            }

            const lower = "abcdefghijklmnopqrstuvwxyz";
            const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const numbers = "0123456789";
            const symbols = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

            let charPool = "";
            if (incLower) charPool += lower;
            if (incUpper) charPool += upper;
            if (incNumbers) charPool += numbers;
            if (incSymbols) charPool += symbols;

            outputContainer.innerHTML = '';
            let allText = "";

            for (let i = 0; i < qty; i++) {
                let password = "";
                // Guarantee at least one of each selected char type for strength
                let guaranteed = [];
                if (incLower) guaranteed.push(lower[Math.floor(Math.random() * lower.length)]);
                if (incUpper) guaranteed.push(upper[Math.floor(Math.random() * upper.length)]);
                if (incNumbers) guaranteed.push(numbers[Math.floor(Math.random() * numbers.length)]);
                if (incSymbols) guaranteed.push(symbols[Math.floor(Math.random() * symbols.length)]);

                for (let j = 0; j < guaranteed.length; j++) {
                    password += guaranteed[j];
                }

                for (let j = guaranteed.length; j < length; j++) {
                    password += charPool[Math.floor(Math.random() * charPool.length)];
                }

                // Shuffle the password to hide guaranteed chars
                password = password.split('').sort(() => 0.5 - Math.random()).join('');

                allText += password + "\n";

                const rowDiv = document.createElement('div');
                rowDiv.className = 'result-row';

                const textSpan = document.createElement('span');
                textSpan.className = 'result-text';
                textSpan.innerText = password;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'btn-copy-single';
                copyBtn.innerText = 'COPY';
                copyBtn.onclick = () => {
                    copyTextToClipboard(password, true);
                };

                rowDiv.appendChild(textSpan);
                rowDiv.appendChild(copyBtn);
                outputContainer.appendChild(rowDiv);
            }

            outputHidden.value = allText;
        }
    </script>
</body>

</html>
