                    style="width: 100%; height: 100%; border: none; background: transparent; color: #a7f3d0; margin: 0; padding: 15px; resize: none; font-family: 'Outfit', sans-serif; font-size: 16px; line-height: 1.6;"></textarea>
            </div>

    <script src="script.js"></script>
    <script>
        const words = ['lorem', 'ipsum', 'dolor', 'sit', 'amet', 'consectetur', 'adipiscing', 'elit', 'sed', 'do', 'eiusmod', 'tempor', 'incididunt', 'ut', 'labore', 'et', 'dolore', 'magna', 'aliqua', 'enim', 'ad', 'minim', 'veniam', 'quis', 'nostrud', 'exercitation', 'ullamco', 'laboris', 'nisi', 'ut', 'aliquip', 'ex', 'ea', 'commodo', 'consequat', 'duis', 'aute', 'irure', 'dolor', 'in', 'reprehenderit', 'in', 'voluptate', 'velit', 'esse', 'cillum', 'dolore', 'eu', 'fugiat', 'nulla', 'pariatur', 'excepteur', 'sint', 'occaecat', 'cupidatat', 'non', 'proident', 'sunt', 'in', 'culpa', 'qui', 'officia', 'deserunt', 'mollit', 'anim', 'id', 'est', 'laborum'];

        function getRandomWord() {
            return words[Math.floor(Math.random() * words.length)];
        }

        function generateSentence() {
            const wordCount = Math.floor(Math.random() * 8) + 5; // 5 to 12 words per sentence
            let sentence = [];
            for (let i = 0; i < wordCount; i++) {
                sentence.push(getRandomWord());
            }
            sentence[0] = sentence[0].charAt(0).toUpperCase() + sentence[0].slice(1);
            return sentence.join(' ') + '.';
        }

        function generateParagraph() {
            const sentenceCount = Math.floor(Math.random() * 5) + 3; // 3 to 7 sentences per paragraph
            let paragraph = [];
            for (let i = 0; i < sentenceCount; i++) {
                paragraph.push(generateSentence());
            }
            return paragraph.join(' ');
        }

        function generateLorem() {
            const format = document.getElementById('loremFormat').value;
            let count = parseInt(document.getElementById('loremCount').value);

            if (isNaN(count) || count < 1) { count = 1; }
            if (count > 200) { count = 200; } // sensible limit

            let result = '';

            if (format === 'words') {
                let selectedWords = [];
                for (let i = 0; i < count; i++) selectedWords.push(getRandomWord());
                result = selectedWords.join(' ');
                result = result.charAt(0).toUpperCase() + result.slice(1) + '.';
            } else if (format === 'sentences') {
                let selectedSentences = [];
                for (let i = 0; i < count; i++) selectedSentences.push(generateSentence());
                result = selectedSentences.join(' ');
            } else {
                let selectedParagraphs = [];
                for (let i = 0; i < count; i++) {
                    // special case to always start with lorem ipsum on first paragraph
                    let p = generateParagraph();
                    if (i === 0) p = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, " + p.toLowerCase();
                    selectedParagraphs.push(p);
                }
                result = selectedParagraphs.join('\n\n');
            }

            document.getElementById('loremOutput').value = result;
            showAlert('LOREM IPSUM GENERATED');
        }

        function copyLorem() {
            const out = document.getElementById('loremOutput').value;
            if (!out) { showAlert('NO OUTPUT TO COPY', true); return; }
            if (navigator.clipboard) {
                navigator.clipboard.writeText(out).then(() => { showAlert('COPIED!'); }).catch(() => fallbackCopy(out));
            } else { fallbackCopy(out); }
        }

        function fallbackCopy(text) {
            let temp = document.createElement("textarea"); temp.value = text;
            document.body.appendChild(temp); temp.select(); document.execCommand("copy");
            document.body.removeChild(temp); showAlert("COPIED!");
        }

        // Auto generate on load
        window.addEventListener('load', () => { setTimeout(generateLorem, 500); });
    </script>
