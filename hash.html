    <div class="overlay" id="sidebar-overlay"></div>

    <div class="page-wrapper">
        <div class="container" style="max-width: 800px;">
            <h2>Secure Hash Generator</h2>
            <label>INPUT STRING</label>
            <textarea id="hashInput" placeholder="Enter text to hash..."
                style="min-height: 100px; margin-bottom: 20px;"></textarea>

            <button class="gen-btn" onclick="generateHashes()">[ GENERATE HASHES ]</button>

            <!-- SHA-1 Result Box -->
            <div style="margin-top: 15px;">
                <label>SHA-1</label>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="text" id="outSha1" readonly placeholder="..."
                        style="margin-bottom: 0; flex: 1; font-size: 13px;">
                    <button class="btn-copy-single" onclick="copyHash('outSha1')" style="padding: 0 20px;">COPY</button>
                </div>
            </div>

            <!-- SHA-256 Result Box -->
            <div style="margin-top: 15px;">
                <label>SHA-256</label>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="text" id="outSha256" readonly placeholder="..."
                        style="margin-bottom: 0; flex: 1; font-size: 13px;">
                    <button class="btn-copy-single" onclick="copyHash('outSha256')"
                        style="padding: 0 20px;">COPY</button>
                </div>
            </div>

            <!-- SHA-384 Result Box -->
            <div style="margin-top: 15px;">
                <label>SHA-384</label>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="text" id="outSha384" readonly placeholder="..."
                        style="margin-bottom: 0; flex: 1; font-size: 13px;">
                    <button class="btn-copy-single" onclick="copyHash('outSha384')"
                        style="padding: 0 20px;">COPY</button>
                </div>
            </div>

            <!-- SHA-512 Result Box -->
            <div style="margin-top: 15px;">
                <label>SHA-512</label>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="text" id="outSha512" readonly placeholder="..."
                        style="margin-bottom: 0; flex: 1; font-size: 13px;">
                    <button class="btn-copy-single" onclick="copyHash('outSha512')"
                        style="padding: 0 20px;">COPY</button>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function getHash(alg, text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest(alg, data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        async function generateHashes() {
            const text = document.getElementById('hashInput').value;
            if (!text) {
                showAlert('PLEASE ENTER TEXT TO HASH', true);
                return;
            }

            try {
                const sha1 = await getHash('SHA-1', text);
                const sha256 = await getHash('SHA-256', text);
                const sha384 = await getHash('SHA-384', text);
                const sha512 = await getHash('SHA-512', text);

                document.getElementById('outSha1').value = sha1;
                document.getElementById('outSha256').value = sha256;
                document.getElementById('outSha384').value = sha384;
                document.getElementById('outSha512').value = sha512;

                showAlert('HASHES GENERATED SUCCESSFULLY');
            } catch (e) {
                showAlert('ERROR GENERATING HASHES', true);
            }
        }

        function copyHash(id) {
            const val = document.getElementById(id).value;
            if (!val) {
                showAlert('NO HASH TO COPY', true);
                return;
            }
            if (navigator.clipboard) {
                navigator.clipboard.writeText(val).then(() => {
                    showAlert('HASH COPIED!');
                }).catch(() => fallbackCopy(val));
            } else {
                fallbackCopy(val);
            }
        }

        function fallbackCopy(text) {
            let temp = document.createElement("textarea");
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
            showAlert("HASH COPIED!");
        }
    </script>
</body>
