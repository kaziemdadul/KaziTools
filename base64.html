    <!-- Overlay -->
    <div class="overlay" id="sidebar-overlay"></div>

    <div class="page-wrapper">
        <div class="container">
            <h2>Base64 Encode & Decode</h2>

            <label>INPUT STRING</label>
            <textarea id="base64Input" placeholder="Enter text or Base64 string here..."
                style="min-height: 120px;"></textarea>

            <div class="grid-input">
                <button class="gen-btn" onclick="encodeBase64()">[ ENCODE TO BASE64 ]</button>
                <button class="gen-btn" onclick="decodeBase64()"
                    style="background: linear-gradient(135deg, #374151, #1e293b); box-shadow: none;">[ DECODE FROM
                    BASE64 ]</button>
            </div>

            <label>RESULT</label>
            <div class="output-container" style="height: 150px; padding: 0;">
                <textarea id="base64Output" readonly
                    style="width: 100%; height: 100%; border: none; background: transparent; color: #a7f3d0; margin: 0; padding: 15px; resize: none;"></textarea>
            </div>
            <button class="copy-btn" onclick="copyBase64()">COPY DATA</button>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function encodeBase64() {
            const input = document.getElementById('base64Input').value;
            if (!input) {
                showAlert('PLEASE ENTER TEXT TO ENCODE', true);
                return;
            }
            try {
                // btoa handles ASCII strings, encodeURIComponent escapes unicode to UTF8
                const encoded = btoa(unescape(encodeURIComponent(input)));
                document.getElementById('base64Output').value = encoded;
                showAlert('SUCCESSFULLY ENCODED');
            } catch (e) {
                showAlert('ENCODING FAILED', true);
            }
        }

        function decodeBase64() {
            const input = document.getElementById('base64Input').value;
            if (!input) {
                showAlert('PLEASE ENTER BASE64 TO DECODE', true);
                return;
            }
            try {
                // atob decodes base64, then decodeURIComponent handles unicode chars
                const decoded = decodeURIComponent(escape(atob(input.trim())));
                document.getElementById('base64Output').value = decoded;
                showAlert('SUCCESSFULLY DECODED');
            } catch (e) {
                showAlert('INVALID BASE64 STRING', true);
            }
        }

        function copyBase64() {
            const out = document.getElementById('base64Output').value;
            if (!out) {
                showAlert('NO OUTPUT TO COPY', true);
                return;
            }
            if (navigator.clipboard) {
                navigator.clipboard.writeText(out).then(() => {
                    showAlert('COPIED!');
                }).catch(() => fallbackCopy(out));
            } else {
                fallbackCopy(out);
            }
        }

        function fallbackCopy(text) {
            let temp = document.createElement("textarea");
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
            showAlert("COPIED!");
        }
    </script>
</body>
