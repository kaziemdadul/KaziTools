<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Mail - KaziTools PRO</title>
    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="style.css">
    <style>
        .hidden {
            display: none !important;
        }

        #email-modal.active {
            display: flex !important;
        }

        .modal-iframe-wrapper {
            flex: 1;
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <!-- Custom Alert Box -->
    <div id="customAlert" class="toast-overlay">
        <h3 id="alertTitle">&gt;&gt; SYSTEM ALERT &lt;&lt;</h3>
        <p id="alertMsg">Operation Completed.</p>
    </div>

    <!-- Navigation Header -->
    <nav class="top-nav">
        <div class="nav-brand">KAZI TOOLS PRO</div>

        <!-- Hamburger Menu -->
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nav-links" id="navLinks">
            <a href="index.html" class="nav-item">Card Gen</a>
            <a href="password.html" class="nav-item">Password Gen</a>
            <a href="prefix.html" class="nav-item">Suffix & Prefix</a>
            <a href="bin.html" class="nav-item">BIN Checker</a>
            <a href="tempmail.html" class="nav-item active">Temp Mail</a>
        </div>
    </nav>

    <div class="page-wrapper">
        <div class="container">
            <h2>Temp Mail</h2>

            <div class="grid-input">
                <div>
                    <label>CUSTOM PREFIX (Optional)</label>
                    <input type="text" id="custom-prefix-input" placeholder="e.g. hello" autocomplete="off">
                </div>
                <div>
                    <label>DOMAIN</label>
                    <select id="domain-select">
                        <option value="auto">Auto-Select Domain</option>
                    </select>
                </div>
            </div>

            <div class="grid-input">
                <div>
                    <button class="gen-btn" id="create-btn" style="margin-bottom: 0;">[ CREATE SPECIFIC ]</button>
                </div>
                <div>
                    <button class="gen-btn" id="refresh-address-btn" style="background: #374151; margin-bottom: 0;">[
                        RANDOM ADDRESS ]</button>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <label>YOUR EMAIL ADDRESS</label>
                <div id="email-wrapper" style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="email-address" readonly value="loading@..." style="margin-bottom: 0;">
                    <button class="btn-copy-single" id="copy-btn" style="padding: 0 20px;">COPY</button>
                </div>
            </div>

            <div id="email-loader" class="hidden"
                style="color: var(--primary); font-size: 14px; margin-bottom: 20px; text-align: center; font-family: 'Consolas', monospace;">
                // GENERATING SECURE ADDRESS...
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px;">
                <label style="margin: 0; color: var(--primary);">INBOX (<span id="email-count">0</span>)</label>
                <button class="btn-copy-single" id="check-mail-btn"
                    style="background: transparent; border: 1px solid var(--primary); color: var(--primary);">[ FORCE
                    CHECK ]</button>
            </div>

            <div id="outputContainer" class="output-container" style="height: 350px;">
                <div id="inbox-empty" class="output-placeholder" style="text-align: center; margin-top: 20px;">
                    // WAITING FOR DATA STREAM...
                </div>
                <div id="inbox-loader" class="hidden"
                    style="color: #64748b; padding: 5px; text-align: center; font-family: 'Consolas', monospace;">//
                    CHECKING FOR INCOMING TRANSMISSIONS...</div>
                <div id="inbox-list" class="hidden" style="display: flex; flex-direction: column; gap: 5px;"></div>
            </div>

        </div>
    </div>

    <!-- Email Reader Modal -->
    <div id="email-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17, 24, 39, 0.9); z-index: 1000; justify-content: center; align-items: center;">
        <div class="container"
            style="max-width: 800px; width: 90%; height: 90%; display: flex; flex-direction: column; position: relative; background: var(--panel); border: 1px solid var(--primary);">
            <button id="close-modal-btn"
                style="position: absolute; top: 15px; right: 20px; background: transparent; border: none; color: var(--error); font-size: 20px; cursor: pointer; font-weight: bold; font-family: 'Consolas', monospace;">X</button>
            <h2 id="modal-subject"
                style="text-align: left; margin-top: 0; margin-bottom: 10px; font-size: 18px; padding-right: 30px; color: var(--primary);">
                Subject</h2>
            <div
                style="font-size: 13px; color: #9ca3af; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-family: 'Consolas', monospace;">
                <div>FROM: <span id="modal-from" style="color: #fff;"></span></div>
                <div>DATE: <span id="modal-date" style="color: #fff;"></span></div>
            </div>
            <div id="modal-body-loader" class="hidden"
                style="color: var(--primary); font-family: 'Consolas', monospace; text-align: center; margin-top: 20px;">
                // LOADING CONTENT...</div>
            <div id="modal-content-frame" class="modal-iframe-wrapper"></div>
        </div>
    </div>

    <!-- Theme toggle dummy to prevent error in JS -->
    <button id="theme-toggle" class="hidden"></button>
    <div id="toast-container" class="hidden"></div>

    <script src="tempmail.js"></script>
    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('show');
        }
    </script>
</body>

</html>
