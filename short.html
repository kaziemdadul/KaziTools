    <!-- Overlay -->

    <div class="page-wrapper">
        <div class="container" style="max-width: 800px;">
            <h2>URL Shortener</h2>

            <label>ENTER LONG URL</label>
            <input type="url" id="longUrlInput" placeholder="https://www.example.com/very/long/path/to/something">

            <label>SELECT PROVIDER</label>
            <select id="providerSelect"
                style="margin-bottom: 20px; width: 100%; padding: 12px; background: rgba(20, 25, 35, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; border-radius: 8px; font-family: 'Inter', sans-serif;">
                <option value="isgd">is.gd (Fastest)</option>
                <option value="vgd">v.gd (Alternative)</option>
                <option value="tinyurl">TinyURL.com</option>
            </select>

            <button class="gen-btn" id="shortenBtn" onclick="shortenUrl()">[ SHORTEN URL ]</button>

            <div id="loading"
                style="display: none; text-align: center; color: var(--primary); font-family: 'Fira Code', monospace; margin-bottom: 20px;">
                // CONNECTING TO API...
            </div>

            <label>SHORTENED RESULT</label>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="shortUrlOutput" readonly placeholder="..."
                    style="margin-bottom: 0; flex: 1; font-family: 'Fira Code', monospace; color: #a7f3d0; background: rgba(0,0,0,0.3);">
                <button class="btn-copy-single" onclick="copyShortUrl()" style="padding: 0 25px;">COPY</button>
            </div>

            <div id="shortUrlError"
                style="color: var(--error); font-size: 13px; font-family: 'Fira Code', monospace; display: none;"></div>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function shortenUrl() {
            const inputField = document.getElementById('longUrlInput');
            const providerSelect = document.getElementById('providerSelect');
            const outputField = document.getElementById('shortUrlOutput');
            const errorBox = document.getElementById('shortUrlError');
            const btn = document.getElementById('shortenBtn');
            const loader = document.getElementById('loading');

            let url = inputField.value.trim();
            const provider = providerSelect.value;

            if (!url) {
                showAlert('PLEASE ENTER A URL', true);
                return;
            }

            // Ensure URL has protocol
            if (!/^https?:\/\//i.test(url)) {
                url = 'http://' + url;
                inputField.value = url;
            }

            errorBox.style.display = 'none';
            outputField.value = '';

            btn.disabled = true;
            btn.style.opacity = '0.5';
            loader.style.display = 'block';

            try {
                let apiUrl = '';
                let resultUrl = '';

                if (provider === 'isgd') {
                    apiUrl = `https://is.gd/create.php?format=json&url=${encodeURIComponent(url)}`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();
                    if (data.shorturl) resultUrl = data.shorturl;
                    else if (data.errormessage) throw new Error(data.errormessage);
                } else if (provider === 'vgd') {
                    apiUrl = `https://v.gd/create.php?format=json&url=${encodeURIComponent(url)}`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();
                    if (data.shorturl) resultUrl = data.shorturl;
                    else if (data.errormessage) throw new Error(data.errormessage);
                } else if (provider === 'tinyurl') {
                    // TinyURL plain text API doesn't support CORS directly, using allorigins proxy
                    const tinyUrlEndpoint = `https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`;
                    apiUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(tinyUrlEndpoint)}`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();
                    if (response.ok && data.contents) {
                        resultUrl = data.contents;
                    } else {
                        throw new Error("Failed to shorten with TinyURL");
                    }
                }

                if (resultUrl) {
                    outputField.value = resultUrl;
                    showAlert('URL SHORTENED SUCCESSFULLY');
                } else {
                    throw new Error("Unknown API error");
                }
            } catch (e) {
                errorBox.innerText = `>> ERROR: ${e.message || 'Failed to connect to shortener API.'}`;
                errorBox.style.display = 'block';
                showAlert('FAILED TO SHORTEN URL', true);
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
                loader.style.display = 'none';
            }
        }

        function copyShortUrl() {
            const val = document.getElementById('shortUrlOutput').value;
            if (!val) {
                showAlert('NO URL TO COPY', true);
                return;
            }
            if (navigator.clipboard) {
                navigator.clipboard.writeText(val).then(() => {
                    showAlert('URL COPIED!');
                }).catch(() => fallbackCopy(val));
            } else {
                fallbackCopy(val);
            }
        }

        function fallbackCopy(text) {
            let temp = document.createElement("textarea");
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
            showAlert("URL COPIED!");
        }
    </script>
</body>
