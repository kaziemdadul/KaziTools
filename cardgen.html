<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Generator Pro</title>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>

    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Custom Alert Box -->
    <div id="customAlert" class="toast-overlay">
        <h3 id="alertTitle">&gt;&gt; SYSTEM ALERT &lt;&lt;</h3>
        <p id="alertMsg">Operation Completed.</p>
    </div>

    <!-- Header/Nav -->
    <header class="header">
        <a href="index.html" class="logo">
            <span class="logo-icon">
                <i data-feather="credit-card"></i>
            </span>
            KAZI TOOLS PRO
        </a>
        <button class="hamburger" id="hamburger-menu" aria-label="Toggle navigation">
            <i data-feather="menu"></i>
        </button>
    </header>

    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-text">MENU</span>
            <button class="close-sidebar" id="close-sidebar" aria-label="Close menu">
                <i data-feather="x"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <i data-feather="home"></i> Home
            </a>
            <a href="cardgen.html" class="nav-item active">
                <i data-feather="credit-card"></i> Card Gen
            </a>
            <a href="password.html" class="nav-item">
                <i data-feather="key"></i> Password Gen
            </a>
            <a href="prefix.html" class="nav-item">
                <i data-feather="hash"></i> Suffix & Prefix
            </a>
            <a href="bin.html" class="nav-item">
                <i data-feather="search"></i> BIN Checker
            </a>
            <a href="tempmail.html" class="nav-item">
                <i data-feather="mail"></i> Temp Mail
            </a>
            <a href="json.html" class="nav-item">
                <i data-feather="code"></i> JSON Formatter
            </a>
            <a href="base64.html" class="nav-item">
                <i data-feather="file-text"></i> Base64
            </a>
            <a href="hash.html" class="nav-item">
                <i data-feather="lock"></i> Hash Gen
            </a>
            <a href="url.html" class="nav-item">
                <i data-feather="link"></i> URL Tools
            </a>
            <a href="ip.html" class="nav-item">
                <i data-feather="globe"></i> IP Lookup
            </a>
            <a href="regex.html" class="nav-item">
                <i data-feather="terminal"></i> Regex Tester
            </a>
            <a href="lorem.html" class="nav-item">
                <i data-feather="type"></i> Lorem Ipsum
            </a>
        </nav>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="sidebar-overlay"></div>

    <div class="page-wrapper">
        <div class="container">
            <h2>Card Generator</h2>

            <label>BIN / PATTERN (e.g. 4535xxxxxx)</label>
            <input type="text" id="binInput" placeholder="453590xxxxxxxxxx" maxlength="18">

            <div class="grid-input">
                <div>
                    <label>MONTH (Type or Select)</label>
                    <input type="text" id="monthInput" list="months" placeholder="Random">
                    <datalist id="months">
                        <option value="Random">
                        <option value="01">
                        <option value="02">
                        <option value="03">
                        <option value="04">
                        <option value="05">
                        <option value="06">
                        <option value="07">
                        <option value="08">
                        <option value="09">
                        <option value="10">
                        <option value="11">
                        <option value="12">
                    </datalist>
                </div>
                <div>
                    <label>YEAR (Type or Select)</label>
                    <input type="text" id="yearInput" list="years" placeholder="Random">
                    <datalist id="years">
                        <option value="Random">
                            <!-- Populated via Script -->
                    </datalist>
                </div>
            </div>

            <div class="grid-input">
                <div>
                    <label>QUANTITY</label>
                    <input type="number" id="quantity" value="20" min="1" max="100">
                </div>
                <div>
                    <label>FORMAT</label>
                    <select id="formatInput">
                        <option value="pipe" selected>Pipe ( | )</option>
                        <option value="colon">Colon ( : )</option>
                        <option value="csv">Comma ( , )</option>
                        <option value="slash">Slash ( / )</option>
                        <option value="space">Space ( )</option>
                        <option value="sql">SQL Query</option>
                        <option value="json">JSON</option>
                    </select>
                </div>
            </div>

            <button class="gen-btn" onclick="generateBulk()">[ INITIATE GENERATION ]</button>

            <div id="outputContainer" class="output-container">
                <div class="output-placeholder" id="placeholderMsg">// DATA STREAM WAITING...</div>
            </div>
            <textarea id="outputHidden" style="display:none;"></textarea>

            <button class="copy-btn" onclick="copyAll()">COPY ALL DATA</button>
        </div>
    </div>

    <!-- Link the external JS file -->
    <script src="script.js"></script>

</body>

</html>
